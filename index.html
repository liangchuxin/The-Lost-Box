<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Lost Box</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section id="stage">
        <div id="scene"></div>
        <nav id="hub" aria-label="Choose a puzzle" hidden>
          <!-- moving light source -->
          <button data-puzzle="photo">Puzzle 2</button>
          <button data-puzzle="glasses">Puzzle 3</button>
          <button data-puzzle="gears">Puzzle 4</button>
          <button data-puzzle="fracture">Puzzle 5</button>
          <button data-puzzle="shadow-cage">Puzzle 6</button>
        </nav>
        <section id="puzzle-panel" hidden>
          <button id="back">← Back</button>
          <!-- moving light source -->
          <iframe id="photo" title="Puzzle 2 — Photo Puzzle" data-src="puzzles/photo/index.html" hidden></iframe>
          <iframe id="glasses" title="Puzzle 3 — Dirty Glasses" data-src="puzzles/glasses/index.html" hidden></iframe>
          <iframe id="gears" title="Puzzle 4 — Gears" data-src="puzzles/gears/index.html" hidden></iframe>
          <iframe id="fracture" title="Puzzle 5 — Fracture" data-src="puzzles/fracture/index.html" hidden></iframe>
          <iframe id="shadow-cage" title="Puzzle 6 — Shadow Cage" data-src="puzzles/shadow-cage/index.html" hidden></iframe>
        </section>
      </section>
      <aside id="inventory">
        <h2>Items</h2>
        <button class="slot" aria-label="Item slot 1"></button>
        <button class="slot" aria-label="Item slot 2"></button>
        <button class="slot" aria-label="Item slot 3"></button>
        <button class="slot" aria-label="Item slot 4"></button>
      </aside>
    </main>
    <script src="vendor/p5.min.js"></script>
    <script src="data.js"></script>
    <script src="menu.js"></script>
    <script src="key.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
