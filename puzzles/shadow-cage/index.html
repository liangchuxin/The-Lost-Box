<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>The Lost Box — Shadow room</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../../vendor/p5.min.js" defer></script>
    <script src="sketch.js" defer></script>
  </head>
  <body>
    <main>
      <div id="scene">
        <button
          class="slot"
          data-slot="0"
          style="left: 34.375%; top: 81.8%"
          aria-label="Front-left position: empty"
        >
          <span>I</span>
        </button>
        <button
          class="slot"
          data-slot="1"
          style="left: 45.3125%; top: 71.97%"
          aria-label="Back-left position: empty"
        >
          <span>II</span>
        </button>
        <button
          class="slot"
          data-slot="2"
          style="left: 67.7083%; top: 83.16%"
          aria-label="Right position: empty"
        >
          <span>III</span>
        </button>
        <button
          class="object-hit"
          data-item="cage"
          aria-label="Select birdcage"
        ></button>
        <button
          class="object-hit"
          data-item="ribbon"
          aria-label="Select ribbon"
        ></button>
        <button
          class="object-hit"
          data-item="pen"
          aria-label="Select fountain pen"
        ></button>
      </div>
      <div class="lamp-controls">
        <button data-move="-1" aria-label="Move lantern left">←</button
        ><button data-move="1" aria-label="Move lantern right">→</button
        ><button id="reset" aria-label="Retry" title="Retry">↻</button>
      </div>
    </main>
    <script src="../../module.js"></script>
  </body>
</html>
